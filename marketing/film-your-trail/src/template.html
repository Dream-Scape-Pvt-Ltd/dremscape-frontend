<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dreamscape Treks — Your Trail (32.5 s film with voiceover)</title>
<meta name="viewport" content="width=1920,height=1080">
<style>
@font-face{font-family:PJS;src:url(data:font/woff2;base64,{{FONT}}) format('woff2');font-weight:200 800;font-style:normal}
:root{--forest:#153d2f;--dark:#0b2a1f;--paper:#f9faf8;--gold:#e4c98a;--mist:#b9cfc5;--ink:#14382a;--muted:#5f7167}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#000;overflow:hidden}
body{font-family:PJS,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;color:var(--paper)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--dark)}
.l{position:absolute;left:0;top:0;width:1920px;height:1080px}
.abs{position:absolute}
img{display:block;max-width:none}
svg{display:block;overflow:visible}

/* editorial system: spreads, framed photographs, labels */
.sp{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.paper{background:#f4f1e9;color:#153d2f}
.forest{background:#153d2f}
.deep{background:#0b2a1f}
.fr{position:absolute;overflow:hidden;border-radius:24px;background:#0b2a1f}
.fr img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.cap{position:absolute;white-space:nowrap;font-weight:800;letter-spacing:-.045em;line-height:1}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:.12em .06em .24em;margin:-.12em -.06em -.24em}
.wm>.w{display:inline-block}
.gold{color:var(--gold)}
.lab{position:absolute;white-space:nowrap;font-size:21px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.lab .no{display:inline-block;margin-right:18px}
.lab .rule{display:inline-block;width:56px;height:2px;vertical-align:middle;margin-right:18px;position:relative;top:-2px}
.eyebrow{position:absolute;white-space:nowrap;font-size:22px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.dash{display:inline-block;width:34px;height:4px;border-radius:2px;background:var(--gold);vertical-align:middle;margin-right:18px;position:relative;top:-3px}
.chip{position:absolute;white-space:nowrap;height:64px;line-height:62px;padding:0 30px;border-radius:32px;border:1.5px solid rgba(249,250,248,.38);color:#f9faf8;font-size:26px;font-weight:650;letter-spacing:-.01em}
.mchip{position:absolute;white-space:nowrap;height:54px;line-height:54px;padding:0 24px;border-radius:27px;background:#fff;color:#153d2f;font-size:22px;font-weight:700;letter-spacing:-.005em;box-shadow:0 10px 30px rgba(11,42,31,.16)}
#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;background-image:url({{GRAIN}});background-size:512px 512px;mix-blend-mode:overlay;opacity:.09;pointer-events:none;z-index:90}
#heroShade{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(90deg,#092419d9,#0924194d 55%,transparent),linear-gradient(0deg,#092419a6,transparent 55%)}

/* the site's journey finder (src/components/home.tsx), at the site's own proportions */
#finder{left:0;top:68px;width:1920px;height:1080px}
#pill{left:140px;top:480px;width:1640px;height:120px;border-radius:60px;background:#fbfcfb;box-shadow:0 30px 80px rgba(3,14,9,.35),0 6px 18px rgba(3,14,9,.18)}
.fld{position:absolute;top:12px;height:96px;width:440px;border-radius:48px}
.fld .lab{position:absolute;left:36px;top:21px;font-size:14px;font-weight:700;letter-spacing:.14em;color:#4e6157;text-transform:uppercase}
.fld .valm{position:absolute;left:36px;top:46px;height:38px;width:340px;overflow:hidden}
.fld .val{position:absolute;left:0;top:0;font-size:26px;font-weight:650;color:var(--ink);letter-spacing:-.02em;line-height:38px;white-space:nowrap}
.fld .cv{position:absolute;right:34px;top:42px;width:20px;height:12px}
.fld .cv path{fill:none;stroke:#4e6157;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fbg{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:48px;background:#e9efeb}
.divd{position:absolute;top:30px;width:1px;height:60px;background:#dfe6e1}
#btn{left:1376px;top:12px;width:250px;height:96px;border-radius:20px;background:var(--forest);overflow:hidden}
#btn .bt{position:absolute;left:30px;top:0;height:96px;line-height:96px;font-size:23px;font-weight:650;color:#fff;letter-spacing:-.01em;white-space:nowrap}
#btn svg{position:absolute;right:26px;top:34px;width:30px;height:28px}
#btn svg path{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.list{width:500px;border-radius:24px;background:#fdfdfc;overflow:hidden;padding:0 12px 12px;box-shadow:0 30px 70px rgba(3,14,9,.32),0 4px 14px rgba(3,14,9,.14);transform-origin:50% 0}
.list .lh{height:56px;padding:24px 14px 0;font-size:14px;font-weight:700;letter-spacing:.14em;color:#5f7167}
.row{position:relative;height:78px;border-radius:18px}
.row .rb{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:18px;background:#e8efea}
.row .num{position:absolute;left:14px;top:17px;width:44px;height:44px;border-radius:50%;border:1.5px solid #cdd8d1;font-size:14px;font-weight:600;color:#6c7d73;text-align:center;line-height:41px}
.row .rt{position:absolute;left:76px;top:0;height:78px;line-height:78px;font-size:24px;font-weight:650;color:var(--ink);letter-spacing:-.015em}
.row .ok{position:absolute;right:22px;top:29px;width:22px;height:18px}
.row .ok path{fill:none;stroke:var(--forest);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#listDest{left:152px;top:616px}
#listDiff{left:632px;top:616px}
#cursor{left:0;top:0;width:44px;height:60px;z-index:40;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
#ripple{left:0;top:0;width:10px;height:10px;border-radius:50%;border:3px solid rgba(255,255,255,.9);z-index:39}

/* choice chips (the finder's options, redrawn as pills) */
.pchip{position:absolute;white-space:nowrap;height:92px;line-height:89px;padding:0 42px;border-radius:46px;border:2px solid rgba(21,61,47,.22);color:#153d2f;font-size:38px;font-weight:700;letter-spacing:-.015em;background:#f4f1e9;transform-origin:50% 50%}
.pchip .fill{position:absolute;left:-2px;top:-2px;right:-2px;bottom:-2px;border-radius:46px;background:#153d2f;transform-origin:50% 50%}
.pchip .tx{position:relative}
.pchip .ok{position:relative;display:inline-block;width:0;overflow:hidden;vertical-align:middle;margin-left:0}
.pchip .ok svg path{fill:none;stroke:#e4c98a;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
/* trip card */
.tcard{position:absolute;border-radius:30px;background:#fff;box-shadow:0 40px 90px rgba(11,42,31,.18),0 8px 24px rgba(11,42,31,.1)}
.tcard .ph{position:absolute;overflow:hidden;border-radius:22px;background:#0b2a1f}
.tcard .ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.tcard .eb{position:absolute;white-space:nowrap;font-size:18px;font-weight:700;letter-spacing:.2em;color:#5f7167}
.tcard .tt{position:absolute;font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.08;color:#153d2f}
.tcard .btn{position:absolute;height:84px;border-radius:22px;background:#153d2f;color:#fff;font-size:28px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;padding:0 34px}
.tcard .btn svg path{fill:none;stroke:#e4c98a;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
/* step cards */
.scard{position:absolute;width:500px;height:520px;border-radius:30px;background:#fff;box-shadow:0 30px 70px rgba(11,42,31,.13),0 6px 18px rgba(11,42,31,.08)}
.scard .no{position:absolute;left:44px;top:44px;font-size:26px;font-weight:800;letter-spacing:.06em;color:#c9a95f}
.scard .ic{position:absolute;left:44px;top:120px;width:132px;height:132px;border-radius:66px;background:#eef3ef}
.scard .ic svg{position:absolute;left:26px;top:26px;width:80px;height:80px}
.scard .ic svg path,.scard .ic svg circle,.scard .ic svg rect{fill:none;stroke:#153d2f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.scard .tt{position:absolute;left:44px;top:310px;width:420px;font-size:50px;font-weight:800;letter-spacing:-.04em;line-height:1.06;color:#153d2f}

/* end title */
#cta{position:absolute;height:96px;border-radius:48px;background:var(--gold);color:var(--forest);font-size:36px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:18px;overflow:hidden;white-space:nowrap}
#cta svg path{fill:none;stroke:var(--forest);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
#url{position:absolute;left:0;width:1920px;text-align:center;font-size:34px;font-weight:700;letter-spacing:.22em;color:rgba(249,250,248,.82)}
</style>
</head>
<body>
<div id="stage"></div>
<script>window.LOGO={{LOGO}};window.LETTERS={{LETTERS}};window.IMG={{IMG}};window.VOLINES={{VOLINES}};</script>
<script>{{TIMELINE}}</script>
<script>
(function(){
'use strict';
{{ENGINE}}
})();
</script>
</body>
</html>
